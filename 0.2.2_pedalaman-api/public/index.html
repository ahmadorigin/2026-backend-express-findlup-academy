<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Buku Frontend</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 0.5rem;
        text-align: left;
      }
      input {
        padding: 0.4rem;
        margin-right: 0.5rem;
      }
      .error {
        color: #c0392b;
        margin-top: 0.5rem;
      }
      .ok {
        color: #27ae60;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>Daftar Buku</h1>
    <form id="book-form">
      <input id="title" placeholder="Judul" required />
      <input id="author" placeholder="Pengarang" required />
      <button type="submit">Tambah</button>
    </form>
    <p id="status" class="ok"></p>
    <p id="error" class="error"></p>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Judul</th>
          <th>Pengarang</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <script src="/script.js"></script>
  </body>
</html>
